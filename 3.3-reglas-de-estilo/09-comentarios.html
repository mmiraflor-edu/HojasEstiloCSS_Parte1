<!DOCTYPE html>
<!--
  3.3 COMENTARIOS · Ejemplo 09 — /* ... */ en CSS (ver css/comentarios.css)
  QUÉ OBSERVAR:
    - Los comentarios documentan (autor, fecha, secciones).
    - Sirven para "desactivar" declaraciones temporalmente (font-size del p).
    - // NO comenta en CSS: estropea la regla siguiente. Por eso el h2 NO sale verde
      agua (se queda negro), aunque la regla h2 de debajo esté bien escrita.
  PRUEBA A CAMBIAR: borra la línea con // y recarga → ahora el h2 sí cambia de color.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CSS - Comentarios</title>
  <link rel="stylesheet" href="css/comentarios.css">
</head>
<body>
  <h1>Comentarios en CSS</h1>
  <h2>Subtítulo h2</h2>
  <p>Párrafo con color crema; el font-size está comentado.</p>
</body>
</html>
