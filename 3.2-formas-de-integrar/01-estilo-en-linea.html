<!DOCTYPE html>
<!--
  3.2 FORMAS DE INTEGRAR ESTILO · Ejemplo 01 — Estilo en línea (atributo style)
  QUÉ OBSERVAR: cada elemento lleva su propio CSS. Funciona, pero si tuviéramos
  50 párrafos habría que repetir el style 50 veces.
  PRUEBA A CAMBIAR: añade un segundo <h2> sin style → no hereda el color azul ni el centrado.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS - Hojas de estilo en línea</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif;">
  <h1 style="background-color: rgb(0,0,0); color: rgb(192,192,192); text-align: center;">Ramón y Cajal</h1>
  <h2 style="color: #0000ff; text-align: center;">(1852-1934)</h2>
  <p style="text-align: justify">
    Santiago Ramón y Cajal fue un médico español, especializado en histología y
    anatomía patológica. Compartió el premio Nobel de Medicina en 1906 con Camillo
    Golgi en reconocimiento de su trabajo sobre la estructura del sistema nervioso.
  </p>
</body>
</html>
